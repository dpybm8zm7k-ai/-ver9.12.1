<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SYSTEM</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 28px;
}

#input-title {
  font-family: Arial, sans-serif;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.panel {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.main-title {
  font-size: clamp(42px, 8vw, 90px);
  margin: 0 0 14px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 16px;
  margin-bottom: 40px;
}

.selection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  max-width: 850px;
  margin: 0 auto;
}

.big-button {
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 18px;
  background: #141414;
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  transition: 0.15s;
}

.big-button:hover {
  background: #222;
  border-color: #888;
}

.big-button:active {
  transform: scale(0.97);
  background: #333;
}

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topbar h2 {
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(28px, 5vw, 50px);
}

.back-button {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid #555;
  color: #fff;
  background: #151515;
  font-weight: 700;
}

.back-button:active {
  transform: scale(0.97);
}

.section {
  background: #111;
  border: 1px solid #2c2c2c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 16px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.text-input,
.number-input,
.select-input {
  min-height: 52px;
  padding: 10px 14px;
  background: #050505;
  border: 1px solid #444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #aaa;
}

.action-button {
  min-height: 52px;
  padding: 10px 20px;
  background: #1c1c1c;
  border: 1px solid #555;
  color: white;
  border-radius: 10px;
  font-weight: 800;
}

.action-button:active {
  transform: scale(0.97);
  background: #333;
}

.danger-button {
  border-color: #722;
  color: #ffb0b0;
}

.primary-button {
  background: #f5f5f5;
  color: #000;
  border-color: #fff;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-header {
  text-align: center;
  margin-bottom: 30px;
}

.staff-header h1 {
  font-size: clamp(34px, 6vw, 62px);
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.staff-header p {
  color: #999;
}

.player-editor-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.staff-player {
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 220px)
    auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 14px;
  border-radius: 12px;
}

.staff-player-name {
  font-size: 20px;
  font-weight: 800;
}

.coin-label {
  color: #aaa;
  font-size: 13px;
}

.throw-result {
  color: #ddd;
  font-size: 13px;
}

.coin-total {
  font-size: 30px;
  font-weight: 900;
  margin-top: 8px;
}

.rule-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.rule-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

/* =========================================================
   入出力デバイス選択
========================================================= */

.device-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}

.device-button {
  min-height: 190px;
  background: #121212;
  border: 1px solid #444;
  border-radius: 18px;
  color: #fff;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
}

.device-button:active {
  transform: scale(0.97);
  background: #292929;
}

/* =========================================================
   入力画面
========================================================= */

.input-layout {
  display: grid;
  grid-template-columns:
    minmax(320px, 1fr)
    minmax(280px, 420px);
  gap: 25px;
  align-items: start;
}

.board-container {
  width: min(760px, 100%);
  margin: 0 auto;
  position: relative;
  touch-action: none;
}

.board-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  user-select: none;
  touch-action: none;
}

.board-hit {
  cursor: pointer;
}

.board-hit:hover {
  opacity: 0.85;
}

.miss-board-button {
  width: 100%;
  margin-top: 8px;
}

.current-info {
  background: #101010;
  border: 1px solid #303030;
  border-radius: 15px;
  padding: 18px;
  position: sticky;
  top: 10px;
}

.current-player-label {
  color: #aaa;
  font-size: 14px;
}

.current-player {
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 900;
  margin: 3px 0 12px;
}

.current-score {
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  line-height: 0.9;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.throw-count {
  font-size: 20px;
  margin-top: 15px;
  color: #ddd;
}

.staff-select-box {
  margin-bottom: 15px;
}

.staff-select-box label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.staff-select {
  width: 100%;
  min-height: 50px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #050505;
  color: #fff;
}

.player-controls {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.player-controls button {
  min-height: 52px;
}

.sound-control {
  margin-top: 18px;
}

.sound-control label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.sound-control input {
  width: 100%;
}

/* =========================================================
   ランキング
========================================================= */

.game-ranking {
  margin-top: 20px;
}

.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ranking-item {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 12px 14px;
  border-radius: 12px;
}

.ranking-number {
  font-size: 25px;
  font-weight: 900;
}

.ranking-name {
  font-size: 19px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ranking-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    Georgia,
    serif;
  font-size: 35px;
  font-weight: 900;
}

/* =========================================================
   ヒット演出
========================================================= */

.hit-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.hit-effect.active {
  animation: hitFlash 0.65s ease-out;
}

.hit-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(80px, 18vw, 220px);
  font-weight: 900;
  text-shadow:
    0 0 15px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.4);
}

@keyframes hitFlash {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  20% {
    opacity: 1;
    transform: scale(1.1);
  }
  55% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.4);
  }
}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
  padding: 0;
  background: #050505;
  overflow: hidden;
}

.output-sound-panel {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 1500;
  width: min(360px, calc(100vw - 20px));
  max-height: 35vh;
  overflow-y: auto;
  padding: 10px;
  background: rgba(17,17,17,.96);
  border: 1px solid #2c2c2c;
  border-radius: 10px;
}

.output-sound-panel .sound-control {
  margin-top: 8px;
}

.output-sound-panel .sound-control:first-child {
  margin-top: 0;
}

.output-layout {
  height: 100vh;
  min-height: 600px;
  display: grid;
  grid-template-rows: 40% 60%;
}

.current-display {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-bottom: 2px solid #292929;
  overflow: hidden;
}

.current-display::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid transparent;
  pointer-events: none;
}

.current-display.player-change::before {
  animation: currentBorder 0.7s ease-out;
}

@keyframes currentBorder {
  0% {
    border-color: #ffd700;
  }

  100% {
    border-color: transparent;
  }
}

.output-board-name {
  position: absolute;
  top: 12px;
  left: 20px;
  color: #777;
  font-size: 14px;
  letter-spacing: 0.15em;
}

.output-player-name {
  font-size: clamp(30px, 5vw, 70px);
  font-weight: 900;
  margin-bottom: 5px;
}

.output-score-area {
  position: relative;
  display: inline-flex;
  align-items: flex-start;
  justify-content: center;
}

.output-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;
  font-weight: 900;
  font-size: clamp(100px, 18vw, 250px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  text-shadow:
    1px 0 0 currentColor,
    -1px 0 0 currentColor;
}

.output-throws {
  position: absolute;
  top: 0;
  left: calc(100% + 18px);
  margin-top: 0;
  white-space: nowrap;
  font-size: clamp(28px, 4vw, 52px);
  color: #ffd700;
  font-weight: 900;
  line-height: 1;
}

.output-throws-label,
.output-throws-number {
  color: #ffd700;
}

.output-throws-number {
  font-size: 1.15em;
}

.output-layout.finish-ranking-mode {
  display: block;
  height: 100vh;
  min-height: 0;
}

.output-layout.finish-ranking-mode .current-display {
  display: none;
}

.output-layout.finish-ranking-mode .other-players {
  width: 100%;
  height: 100vh;
  min-height: 100vh;
  padding: 24px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  align-content: center;
  gap: 14px;
}

.output-layout.finish-ranking-mode .ranking-title {
  font-size: clamp(28px, 5vw, 52px);
  padding: 10px;
}

.output-layout.finish-ranking-mode ~ .output-sound-panel {
  display: none;
}

.finish-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
  pointer-events: none;
  z-index: 2000;
  opacity: 0;
}

.finish-effect.active {
  animation: finishFlash 0.8s ease-out forwards;
}

.finish-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(90px, 20vw, 260px);
  font-weight: 900;
  color: #ffd700;
  letter-spacing: 0.04em;
}

@keyframes finishFlash {
  0% {
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

.other-players {
  padding: 15px 20px 25px;
  overflow-y: auto;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  align-content: start;
  gap: 12px;
}

.other-player-card {
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 12px;
  padding: 16px 18px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.other-player-name {
  color: #bbb;
  font-size: 24px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.other-player-card.active-player .other-player-score {
  color: #ffd700;
}

.other-player-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    Georgia,
    serif;
  font-size: 45px;
  font-weight: 900;
  line-height: 1;
  margin-top: 5px;
}

.empty-message {
  color: #555;
  text-align: center;
  padding: 30px;
}

.ranking-title {
  grid-column: 1 / -1;
  color: #aaa;
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  padding: 5px;
}

/* =========================================================
   レスポンシブ
========================================================= */

@media (max-width: 800px) {
  .screen {
    padding: 16px;
  }

  .selection-grid,
  .device-grid {
    grid-template-columns: 1fr;
  }

  .input-layout {
    grid-template-columns: 1fr;
  }

  .current-info {
    position: static;
  }

  .staff-player {
    grid-template-columns: 1fr;
  }

  .rule-grid {
    grid-template-columns: 1fr;
  }

  .output-layout {
    grid-template-rows: 40% 60%;
  }

  .other-players {
    grid-template-columns:
      repeat(auto-fit, minmax(160px, 1fr));
  }
}

@media (max-width: 500px) {
  .player-controls {
    grid-template-columns: 1fr;
  }

  .other-player-card {
    min-height: 85px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     画面1：最初の選択
======================================================= -->

<div id="screen-role" class="screen center-screen">
  <div class="panel">

    <h1 class="title main-title">
      DARTS
    </h1>

    <div class="subtitle">
      SELECT SYSTEM
    </div>

    <div class="selection-grid">

      <button
        class="big-button"
        onclick="selectRole('board1')">
        ダーツボード1
      </button>

      <button
        class="big-button"
        onclick="selectRole('board2')">
        ダーツボード2
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffA')">
        スタッフA
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffB')">
        スタッフB
      </button>

    </div>

  </div>
</div>


<!-- =======================================================
     画面2：入力 / 出力
======================================================= -->

<div id="screen-device" class="screen center-screen hidden">

  <div class="panel">

    <div class="topbar">
      <h2 id="device-board-title">
        ダーツボード1
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>
    </div>

    <div class="subtitle">
      DEVICE TYPE
    </div>

    <div class="device-grid">

      <button
        class="device-button"
        onclick="openInputDevice()">
        入力デバイス
      </button>

      <button
        class="device-button"
        onclick="openOutputDevice()">
        出力デバイス
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     スタッフ画面
======================================================= -->

<div id="screen-staff" class="screen hidden">

  <div class="panel">

    <div class="topbar">
      <h2 id="staff-title">
        スタッフA
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>
    </div>


    <div class="section">

      <h3 class="section-title">
        プレイヤー管理
      </h3>

      <div class="input-row">

        <input
          id="new-player-name"
          class="text-input"
          type="text"
          placeholder="プレイヤー名">

        <input
          id="new-player-coins"
          class="number-input"
          type="number"
          min="0"
          step="1"
          placeholder="保有コイン">

        <button
          class="action-button primary-button"
          onclick="addStaffPlayer()">
          プレイヤー追加
        </button>

      </div>

    </div>


    <div class="section">

      <h3 class="section-title">
        コイン → 投球数設定
      </h3>

      <div class="rule-grid">

        <div class="rule-item">
          <label>
            1投に必要なコイン
          </label>

          <input
            id="coins-per-throw"
            class="number-input"
            type="number"
            min="1"
            value="10">
        </div>

        <div class="rule-item">
          <label>
            最低投球数
          </label>

          <input
            id="minimum-throws"
            class="number-input"
            type="number"
            min="0"
            value="3">
        </div>

        <div class="rule-item">
          <label>
            最大投球数
          </label>

          <input
            id="maximum-throws"
            class="number-input"
            type="number"
            min="1"
            value="30">
        </div>

      </div>

      <br>

      <button
        class="action-button"
        onclick="saveStaffData()">
        スタッフデータを保存
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        登録プレイヤー
      </h3>

      <div
        id="staff-player-list"
        class="player-editor-list">
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     入力デバイス
======================================================= -->

<div id="screen-input" class="screen hidden">

  <div class="topbar">

    <h2 id="input-title">
      ダーツボード1
    </h2>

    <button
      class="back-button"
      onclick="goDeviceSelect()">
      戻る
    </button>

  </div>


  <div class="input-layout">

    <div>

      <div class="board-container">

        <svg
          id="dartboard"
          class="board-svg"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg">

          <g id="board-graphics"></g>

        </svg>

        <button
          class="action-button miss-board-button"
          onclick="registerMiss()">
          外れ
        </button>

      </div>

    </div>


    <div>

      <div class="current-info">

        <div class="staff-select-box">

          <label>
            使用するスタッフ
          </label>

          <select
            id="input-staff-select"
            class="staff-select"
            onchange="loadStaffSnapshot()">

            <option value="">
              スタッフを選択
            </option>

            <option value="A">
              スタッフA
            </option>

            <option value="B">
              スタッフB
            </option>

          </select>

        </div>


        <div class="current-player-label">
          投球中
        </div>

        <div
          id="input-current-player"
          class="current-player">
          -
        </div>

        <div
          id="input-current-score"
          class="current-score">
          0
        </div>

        <div
          id="input-throw-count"
          class="throw-count">
          残り投球数：-
        </div>


        <div class="player-controls">

          <button
            class="action-button"
            onclick="addGamePlayer()">
            プレイヤー追加
          </button>

          <button
            class="action-button"
            onclick="removeCurrentPlayer()">
            プレイヤー削除
          </button>

          <button
            class="action-button danger-button"
            onclick="resetGameScore()">
            点数リセット
          </button>

          <button
            class="action-button"
            onclick="registerMiss()">
            外れ
          </button>

        </div>

        <button
          class="action-button"
          style="width:100%; margin-top:8px;"
          onclick="toggleDartsTableStatus()">
          テーブル使用状況変更
        </button>


        <div class="sound-control">

          <label>
            通常得点MP3
          </label>

          <input
            id="sound-normal"
            type="file"
            accept="audio/mpeg,audio/mp3"
            onchange="selectSoundFile('normal', this)">

        </div>

<script>
/* =========================================================
   Firebase設定
   Firebase Module版はページ末尾で初期化する。
========================================================= */

var firebaseDb = null;

var firebaseReady = false;


/* =========================================================
   グローバル状態
========================================================= */

let currentRole = null;

let currentBoard = null;

let currentDevice = null;

let currentChannel = "";

let currentStaff = "";

let staffSnapshot = null;

let players = [];

let currentTurnIndex = 0;

let remainingThrows = 0;

let currentRound = 1;

let maxRounds = 1;

let hitMarkers = [];

let gameFinished = false;

let gameFinishTimestamp = 0;

let lastShownFinishTimestamp = 0;

let lastProcessedFinishTimestamp = 0;

let finishDisplayTimer = null;

let dartsTableStatus = 'available';

let dartsTableStatusTableListener = null;

let dartsTableStatusSyncListener = null;

let ranking = [];

let soundConfig = {

  normal: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  double: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  triple: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  miss: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  bull: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  doubleBull: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  },

  finish: {
    enabled: false,
    fileName: "",
    dataUrl: ""
  }

};

let localSoundUrl = null;

let localAudio = null;

let localAudios = {

  normal: null,
  double: null,
  triple: null,
  miss: null,
  bull: null,
  doubleBull: null,
  finish: null

};

window._lastSyncTime = 0;

let lastProcessedHitTimestamp = 0;

let firebaseInitialStateReceived = false;

let dartsTableSessionId = null;


/* =========================================================
   Firebase チャンネル
========================================================= */

function getFirebaseChannelKey() {

  return encodeURIComponent(currentChannel)
    .replace(/\./g, '%2E');

}


function getFirebaseSoundKey() {

  return getFirebaseChannelKey();

}


function initFirebaseChannel(chName) {

  if (!firebaseDb) return;

  currentChannel = chName;

  firebaseInitialStateReceived = false;

  const channelRef = firebaseDb.ref(
    'darts_channels/' +
    getFirebaseChannelKey()
  );

  channelRef.off();

  channelRef.on('value', (snapshot) => {

    const data = snapshot.val();

    if (!data || !data.timestamp) return;

    if (
      window._lastSyncTime &&
      data.timestamp <= window._lastSyncTime
    ) {
      return;
    }

    window._lastSyncTime = data.timestamp;

    const isInitial =
      !firebaseInitialStateReceived;

    firebaseInitialStateReceived = true;

    applyIncomingState(
      data,
      isInitial
    );

  });


  const soundRef = firebaseDb.ref(
    'darts_sounds/' +
    getFirebaseSoundKey()
  );

  soundRef.off();

  soundRef.on(
    'value',
    snapshot => {

      const data =
        snapshot.val();

      if (!data) return;

      applyIncomingSoundConfig(
        data
      );

    }
  );

}


/* =========================================================
   Firebaseチャンネル監視解除
========================================================= */

function stopFirebaseChannel() {

  if (
    firebaseDb &&
    currentChannel
  ) {

    firebaseDb.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    ).off();

    firebaseDb.ref(
      'darts_sounds/' +
      getFirebaseSoundKey()
    ).off();

    if (dartsTableStatusTableListener) {
      firebaseDb.ref(
        'casinoTables/darts' + currentBoard
      ).off();
      dartsTableStatusTableListener = null;
    }

    if (dartsTableStatusSyncListener) {
      firebaseDb.ref(
        'dartsTableSync/' + currentBoard
      ).off();
      dartsTableStatusSyncListener = null;
    }

  }

}


/* =========================================================
   Firebaseへ現在のゲーム状態を送信
========================================================= */

function broadcastStateToFirebase(
  triggerBanner = false,
  bannerText = "Player Change"
) {

  if (!firebaseDb) return;

  const statePayload = {

    type: 'STATE_SYNC',

    timestamp: Date.now(),

    players: players,

    currentTurnIndex: currentTurnIndex,

    remainingThrows: remainingThrows,

    currentRound: currentRound,

    maxRounds: maxRounds,

    hitMarkers: hitMarkers,

    soundConfig:
      getSoundMeta(),

    gameFinished:
      gameFinished,

    gameFinishTimestamp:
      gameFinishTimestamp,

    ranking:
      ranking,

    triggerTurnBanner: triggerBanner,

    bannerText: bannerText

  };

  try {

    firebaseDb
      .ref(
        'darts_channels/' +
        getFirebaseChannelKey()
      )
      .set(statePayload);

  } catch (e) {

    console.warn(
      "Firebase sync failed:",
      e
    );

  }

}


/* =========================================================
   Firebase受信
========================================================= */

function applyIncomingState(
  data,
  isInitial = false
) {

  if (!data) return;

  /*
   * Firebase Realtime Databaseから取得した
   * players はオブジェクトになる場合があるため、
   * 配列として正規化する。
   */

  if (Array.isArray(data.players)) {

    players = data.players;

  } else if (
    data.players &&
    typeof data.players === 'object'
  ) {

    players = Object.values(data.players);

  } else {

    players = [];

  }


  currentTurnIndex =
    Number(data.currentTurnIndex || 0);

  remainingThrows =
    Number(data.remainingThrows || 0);

  currentRound =
    Number(data.currentRound || 1);

  maxRounds =
    Number(data.maxRounds || 1);

  hitMarkers =
    Array.isArray(data.hitMarkers)
      ? data.hitMarkers
      : [];

  gameFinished =
    data.gameFinished === true;

  gameFinishTimestamp =
    Number(data.gameFinishTimestamp || 0);

  ranking =
    Array.isArray(data.ranking)
      ? data.ranking
      : [];


  if (data.soundConfig) {

    mergeSoundMeta(
      data.soundConfig
    );

  }


  /*
   * Firebaseから受信したplayersに
   * currentTurnIndexが範囲外にならないようにする。
   */

  if (
    players.length > 0 &&
    currentTurnIndex >= players.length
  ) {

    currentTurnIndex =
      players.length - 1;

  }

  if (isInitial && gameFinished) {
    lastShownFinishTimestamp = gameFinishTimestamp;
    lastProcessedFinishTimestamp = gameFinishTimestamp;
  }


  renderInputState();

  renderOutputState();


  /*
   * 初回読み込み時には
   * 過去の得点演出を再生しない。
   */

  const latestHit =
    getLatestHitMarker();


  if (
    latestHit &&
    latestHit.timestamp &&
    !isInitial &&
    latestHit.timestamp >
      lastProcessedHitTimestamp
  ) {

    lastProcessedHitTimestamp =
      latestHit.timestamp;

    showHitEffect(
      latestHit.score,
      latestHit.label
    );

    playScoreSound(
      latestHit.soundType
    );

  }


  if (
    data.gameFinished &&
    gameFinishTimestamp &&
    !isInitial &&
    gameFinishTimestamp > lastProcessedFinishTimestamp
  ) {

    lastProcessedFinishTimestamp =
      gameFinishTimestamp;

    playScoreSound(
      'finish'
    );

  }


  if (data.triggerTurnBanner) {

    showTurnChangeEffect(
      data.bannerText || "Player Change"
    );

  }

}


/* =========================================================
   最新ヒット取得
========================================================= */

function getLatestHitMarker() {

  if (
    !Array.isArray(hitMarkers) ||
    !hitMarkers.length
  ) {

    return null;

  }

  return hitMarkers.reduce(
    (latest, marker) => {

      if (!latest) return marker;

      return Number(
        marker.timestamp || 0
      ) >
      Number(
        latest.timestamp || 0
      )
        ? marker
        : latest;

    },
    null
  );

}


/* =========================================================
   画面切り替え
========================================================= */

function hideAllScreens() {

  document
    .querySelectorAll('.screen')
    .forEach(el => {

      el.classList.add('hidden');

    });

}


function selectRole(role) {

  currentRole = role;

  if (role === 'staffA') {

    openStaff('A');

    return;

  }

  if (role === 'staffB') {

    openStaff('B');

    return;

  }

  if (role === 'board1') {

    currentBoard = 1;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード1';

  }

  if (role === 'board2') {

    currentBoard = 2;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード2';

  }

  hideAllScreens();

  document
    .getElementById('screen-device')
    .classList
    .remove('hidden');

}


function goRoleSelect() {

  stopFirebaseChannel();

  currentRole = null;

  currentBoard = null;

  currentDevice = null;

  currentStaff = "";

  currentChannel = "";

  hideAllScreens();

  document
    .getElementById('screen-role')
    .classList
    .remove('hidden');

}


function goDeviceSelect() {

  stopFirebaseChannel();

  currentDevice = null;

  currentChannel = "";

  hideAllScreens();

  document
    .getElementById('screen-device')
    .classList
    .remove('hidden');

}


/* =========================================================
   入力デバイス
========================================================= */

function openInputDevice() {

  currentDevice = 'input';

  currentChannel =
    'board_' +
    currentBoard;

  hideAllScreens();

  document
    .getElementById('screen-input')
    .classList
    .remove('hidden');

  document.getElementById(
    'input-title'
  ).textContent =

  initFirebaseChannel(

  );

  updateDartsTableStatusButton('available');

  watchDartsTableStatus();

  renderInputState();

}


function openOutputDevice() {

  currentDevice = 'output';

  currentChannel =
    'board_' +
    currentBoard;

  hideAllScreens();

  document
    .getElementById('screen-output')
    .classList
    .remove('hidden');

  document.getElementById(
    'output-board-name'
  ).textContent =
    'DARTS BOARD ' +
    currentBoard;

  initFirebaseChannel(

  renderOutputState();

}


/* =========================================================
   スタッフ画面
========================================================= */

function openStaff(staff) {

  currentStaff = staff;

  hideAllScreens();

  document
    .getElementById('screen-staff')
    .classList
    .remove('hidden');

  document.getElementById(
    'staff-title'
  ).textContent =
    'スタッフ' + staff;

  loadStaffData();

}


function staffDataRef() {

  if (!firebaseDb) return null;

  return firebaseDb.ref(
    'darts_staff/' +
    currentStaff
  );

}


/* =========================================================
   スタッフデータ読み込み
   Firebaseはon('value')で
   リアルタイム同期
========================================================= */

function loadStaffData() {

  if (firebaseDb && currentStaff) {

    staffDataRef().off();

  }


  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        currentStaff
      );

    if (local) {

      try {

        const data =
          JSON.parse(local);

        staffSnapshot =
          data;

        renderStaffData(data);

      } catch (e) {

        console.warn(
          'Local staff data parse failed:',
          e
        );

      }

    } else {

      const defaultData = {

        players: [],

        coinsPerThrow: 10,

        minimumThrows: 3,

        maximumThrows: 30

      };

      staffSnapshot =
        defaultData;

      renderStaffData(
        defaultData
      );

    }

    return;

  }


  staffDataRef().on(
    'value',
    snapshot => {

      const data =
        snapshot.val();

      if (!data) {

        const defaultData = {

          players: [],

          coinsPerThrow: 10,

          minimumThrows: 3,

          maximumThrows: 30

        };

        staffSnapshot =
          defaultData;

        renderStaffData(
          defaultData
        );

        return;

      }

      staffSnapshot =
        JSON.parse(
          JSON.stringify(data)
        );

      renderStaffData(
        staffSnapshot
      );

    }
  );

}


/* =========================================================
   スタッフ画面描画
========================================================= */

function renderStaffData(data) {

  if (!data) return;


  document.getElementById(
    'coins-per-throw'
  ).value =
    Number(data.coinsPerThrow || 10);

  document.getElementById(
    'minimum-throws'
  ).value =
    Number(
      data.minimumThrows ?? 3
    );

  document.getElementById(
    'maximum-throws'
  ).value =
    Number(
      data.maximumThrows || 30
    );


  renderStaffPlayers(
    Array.isArray(data.players)
      ? data.players
      : (
          data.players &&
          typeof data.players === 'object'
            ? Object.values(data.players)
            : []
        )
  );

}


/* =========================================================
   スタッフプレイヤー追加
========================================================= */

function addStaffPlayer() {

  const nameInput =
    document.getElementById(
      'new-player-name'
    );

  const coinInput =
    document.getElementById(
      'new-player-coins'
    );

  const name =
    nameInput.value.trim();

  const coins =
    Number(coinInput.value);

  if (!name) {

    alert(
      'プレイヤー名を入力してください。'
    );

    return;

  }

  if (
    !Number.isFinite(coins) ||
    coins < 0
  ) {

    alert(
      '保有コイン数を正しく入力してください。'
    );

    return;

  }


  const data =
    getCurrentStaffData();


  if (!Array.isArray(data.players)) {

    data.players = [];

  }


  data.players.push({

    id:
      'p_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name: name,

    coins: Math.floor(coins)

  });


  saveStaffObject(data);

  nameInput.value = '';

  coinInput.value = '';


  renderStaffPlayers(
    data.players
  );

}


/* =========================================================
   スタッフプレイヤー削除
========================================================= */

function removeStaffPlayer(id) {

  const data =
    getCurrentStaffData();


  if (!Array.isArray(data.players)) {

    data.players = [];

  }


  data.players =
    data.players.filter(
      player =>
        player.id !== id
    );


  saveStaffObject(data);

  renderStaffPlayers(
    data.players
  );

}


/* =========================================================
   スタッフプレイヤーのコイン変更
========================================================= */

function updateStaffPlayerCoins(
  id,
  value
) {

  const coins =
    Math.max(
      0,
      Math.floor(
        Number(value) || 0
      )
    );


  const data =
    getCurrentStaffData();


  if (!Array.isArray(data.players)) {

    data.players = [];

  }


  const player =
    data.players.find(
      p =>
        p.id === id
    );


  if (!player) return;


  player.coins =
    coins;


  saveStaffObject(data);

}


/* =========================================================
   現在のスタッフデータ取得
========================================================= */

function getCurrentStaffData() {

  if (staffSnapshot) {

    return JSON.parse(
      JSON.stringify(
        staffSnapshot
      )
    );

  }


  return {

    players: [],

    coinsPerThrow:
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10,

    minimumThrows:
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 3,

    maximumThrows:
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30

  };

}


/* =========================================================
   スタッフデータ保存
========================================================= */

function saveStaffObject(data) {

  if (!data) return;


  if (!Array.isArray(data.players)) {

    if (
      data.players &&
      typeof data.players === 'object'
    ) {

      data.players =
        Object.values(
          data.players
        );

    } else {

      data.players = [];

    }

  }


  data.coinsPerThrow =
    Math.max(
      1,
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10
    );


  data.minimumThrows =
    Math.max(
      0,
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 0
    );


  data.maximumThrows =
    Math.max(
      1,
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30
    );


  staffSnapshot =
    JSON.parse(
      JSON.stringify(data)
    );


  if (firebaseDb) {

    staffDataRef().set(
      data
    )
    .catch(error => {

      console.warn(
        'Firebase staff save failed:',
        error
      );

      alert(
        'Firebaseへの保存に失敗しました。'
      );

    });

  } else {

    localStorage.setItem(
      'darts_staff_' +
      currentStaff,
      JSON.stringify(data)
    );

  }

}


/* =========================================================
   スタッフデータ保存ボタン
========================================================= */

function saveStaffData() {

  const data =
    getCurrentStaffData();

  saveStaffObject(data);

  alert(
    'スタッフ' +
    currentStaff +
    'のデータを保存しました。'
  );

}


/* =========================================================
   スタッフプレイヤー表示
========================================================= */

function renderStaffPlayers(
  list
) {

  const container =
    document.getElementById(
      'staff-player-list'
    );

  container.innerHTML = '';


  if (!list.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      'プレイヤーが登録されていません' +
      '</div>';

    return;

  }


  list.forEach(player => {

    const row =
      document.createElement(
        'div'
      );

    row.className =
      'staff-player';


    row.innerHTML = `

      <div>
        <div class="staff-player-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="coin-label">
          保有コイン
        </div>
      </div>

      <div>

        <input
          class="number-input"
          style="width:100%;"
          type="number"
          min="0"
          value="${Number(player.coins || 0)}"
          onchange="updateStaffPlayerCoins(
            '${escapeJs(player.id)}',
            this.value
          )">

      </div>

      <button
        class="action-button danger-button"
        onclick="removeStaffPlayer(
          '${escapeJs(player.id)}'
        )">
        削除
      </button>

    `;


    container.appendChild(
      row
    );

  });

}


/* =========================================================
   スタッフのスナップショットを
   入力デバイスで読み込む
========================================================= */

function loadStaffSnapshot() {

  const select =
    document.getElementById(
      'input-staff-select'
    );

  const staff =
    select.value;


  if (!staff) return;


  currentStaff =
    staff;


  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        staff
      );


    if (!local) {

      alert(
        'スタッフ' +
        staff +
        'のデータがありません。'
      );

      return;

    }


    applyStaffSnapshot(
      JSON.parse(local)
    );

    return;

  }


  firebaseDb.ref(
    'darts_staff/' +
    staff
  ).once(
    'value',
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        alert(
          'スタッフ' +
          staff +
          'のデータがありません。'
        );

        return;

      }


      applyStaffSnapshot(
        data
      );

    }
  );

}


/* =========================================================
   テーブルコントロールへダーツ情報を送信
   スタッフ選択時に投球者数・各投球者の投球数を送信する。
========================================================= */

async function syncDartsSessionStart() {

  if (!firebaseDb) return;
  if (!currentBoard) return;
  if (currentDevice !== 'input') return;

  const tableId =
    'darts' +
    currentBoard;

  const sessionId =
    'darts_' +
    currentBoard +
    '_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);

  dartsTableSessionId =
    sessionId;

  const selectedAt =
    Date.now();

  const throwCounts =
    players.map(
      player =>
        Math.max(
          0,
          Number(
            player.initialThrows || 0
          )
        )
    );

  const totalThrows =
    throwCounts.reduce(
      (sum, value) =>
        sum + value,
      0
    );

  const tableRef =
    firebaseDb.ref(
      'casinoTables/' +
      tableId
    );

  const syncRef =
    firebaseDb.ref(
      'dartsTableSync/' +
      currentBoard
    );

  const payload = {

    type:
      'DARTS_SESSION',

    status:
      'occupied',

    board:
      currentBoard,

    tableId:
      tableId,

    staff:
      currentStaff,

    playerCount:
      players.length,

    throwCounts:
      throwCounts,

    totalThrows:
      totalThrows,

    selectedAt:
      selectedAt,

    timestamp:
      selectedAt,

    sessionId:
      sessionId

  };

  try {

    await Promise.all([

      tableRef.update({

        occupied:
          true,

        startedAt:
          selectedAt,

        dartsPlayerCount:
          players.length,

        dartsThrowCounts:
          throwCounts,

        dartsTotalThrows:
          totalThrows,

        dartsSessionId:
          sessionId,

        dartsSessionTimestamp:
          selectedAt

      }),

      syncRef.set(
        payload
      )

    ]);

  } catch (error) {

    console.warn(
      'Darts table sync failed:',
      error
    );

  }

}


/* =========================================================
   ダーツ終了をテーブルコントロールへ送信
   全員の投球終了時点を記録し、
   テーブルコントロール側で10秒後に使用終了する。
========================================================= */

async function syncDartsSessionFinish() {

  if (!firebaseDb) return;
  if (!currentBoard) return;
  if (!dartsTableSessionId) return;

  const finishedAt =
    Date.now();

  try {

    await firebaseDb
      .ref(
        'dartsTableSync/' +
        currentBoard
      )
      .update({

        type:
          'DARTS_SESSION',

        status:
          'finished',

        board:
          currentBoard,

        tableId:
          'darts' +
          currentBoard,

        finishedAt:
          finishedAt,

        timestamp:
          finishedAt,

        sessionId:
          dartsTableSessionId

      });

  } catch (error) {

    console.warn(
      'Darts finish sync failed:',
      error
    );

  }

}


/* =========================================================
   ダーツ台の使用状況表示
========================================================= */

function updateDartsTableStatusButton(status) {

  const button =
    document.querySelector(
      '[onclick="toggleDartsTableStatus()"]'
    );

  if (!button) return;

  dartsTableStatus = status;

  button.textContent =
    status === 'in-use'
      ? '使用中'
      : status === 'finished'
        ? '使用終了'
        : '空き';

  button.style.color =
    '#fff';

  button.style.borderColor =
    status === 'in-use'
      ? '#218d42'
      : status === 'finished'
        ? '#cf2929'
        : '#666';

  button.style.background =
    status === 'in-use'
      ? '#218d42'
      : status === 'finished'
        ? '#cf2929'
        : '#666';
}

function resolveDartsTableStatus(table, sync) {

  if (
    sync &&
    sync.status === 'finished'
  ) {
    return 'finished';
  }

  if (
    sync &&
    sync.status === 'manual'
  ) {
    return sync.manualOccupied === true
      ? 'in-use'
      : 'available';
  }

  return table && table.occupied === true
    ? 'in-use'
    : 'available';
}

function watchDartsTableStatus() {

  if (!firebaseDb || !currentBoard) return;

  const tablePath =
    'casinoTables/darts' + currentBoard;

  const syncPath =
    'dartsTableSync/' + currentBoard;

  if (dartsTableStatusTableListener) {
    firebaseDb.ref(tablePath).off();
    dartsTableStatusTableListener = null;
  }

  if (dartsTableStatusSyncListener) {
    firebaseDb.ref(syncPath).off();
    dartsTableStatusSyncListener = null;
  }

  const tableRef =
    firebaseDb.ref(tablePath);

  const syncRef =
    firebaseDb.ref(syncPath);

  let latestTable = {};
  let latestSync = {};

  const renderStatus = () => {
    updateDartsTableStatusButton(
      resolveDartsTableStatus(
        latestTable,
        latestSync
      )
    );
  };

  dartsTableStatusTableListener =
    tableRef.on(
      'value',
      snapshot => {
        latestTable =
          snapshot.val() || {};
        renderStatus();
      }
    );

  dartsTableStatusSyncListener =
    syncRef.on(
      'value',
      snapshot => {
        latestSync =
          snapshot.val() || {};
        renderStatus();
      }
    );
}


/* =========================================================
   ダーツ台の使用状況変更
========================================================= */

function toggleDartsTableStatus() {

  if (!firebaseDb) {

    alert(
      'Firebaseに接続されていません。'
    );

    return;

  }

  if (!currentBoard) return;

  const tableId =
    'darts' +
    currentBoard;

  const tableRef =
    firebaseDb.ref(
      'casinoTables/' +
      tableId
    );

  const syncRef =
    firebaseDb.ref(
      'dartsTableSync/' +
      currentBoard
    );

  Promise.all([
    tableRef.once('value'),
    syncRef.once('value')
  ])
  .then(([tableSnapshot, syncSnapshot]) => {

    const table =
      tableSnapshot.val() || {};

    const sync =
      syncSnapshot.val() || {};

    const currentStatus =
      resolveDartsTableStatus(
        table,
        sync
      );

    const now =
      Date.now();

    if (currentStatus === 'available') {

      return Promise.all([
        tableRef.update({
          occupied: true,
          startedAt: now,
          dartsPlayerCount: null,
          dartsThrowCounts: null,
          dartsTotalThrows: null,
          dartsSessionId: null,
          dartsSessionTimestamp: null
        }),
        syncRef.set({
          type: 'DARTS_MANUAL_STATUS',
          status: 'manual',
          board: currentBoard,
          tableId: tableId,
          manualOccupied: true,
          timestamp: now,
          sessionId: null
        })
      ]);
    }

    if (currentStatus === 'in-use') {

      return syncRef.set({
        type: 'DARTS_MANUAL_STATUS',
        status: 'finished',
        board: currentBoard,
        tableId: tableId,
        manualOccupied: true,
        finishedAt: now,
        timestamp: now,
        sessionId: dartsTableSessionId || null
      });
    }

    dartsTableSessionId = null;

    return Promise.all([
      tableRef.update({
        occupied: false,
        startedAt: null,
        dartsPlayerCount: null,
        dartsThrowCounts: null,
        dartsTotalThrows: null,
        dartsSessionId: null,
        dartsSessionTimestamp: null
      }),
      syncRef.set({
        type: 'DARTS_MANUAL_STATUS',
        status: 'manual',
        board: currentBoard,
        tableId: tableId,
        manualOccupied: false,
        timestamp: now,
        sessionId: null
      })
    ]);
  })
  .catch(error => {
    console.warn(
      'Darts table status change failed:',
      error
    );
  });
}

/* =========================================================
   スタッフスナップショット適用
========================================================= */

function applyStaffSnapshot(data) {

  const ruleCoins =
    Math.max(
      1,
      Number(
        data.coinsPerThrow || 10
      )
    );


  const minThrows =
    Math.max(
      0,
      Number(
        data.minimumThrows || 0
      )
    );


  const maxThrows =
    Math.max(
      1,
      Number(
        data.maximumThrows || 30
      )
    );


  staffSnapshot =
    JSON.parse(
      JSON.stringify(data)
    );


  let staffPlayers =
    Array.isArray(data.players)
      ? data.players
      : (
          data.players &&
          typeof data.players === 'object'
            ? Object.values(data.players)
            : []
        );


  players =
    staffPlayers.map(
      player => {

        const coins =
          Math.max(
            0,
            Number(
              player.coins || 0
            )
          );


        const calculatedThrows =
          Math.floor(
            coins / ruleCoins
          );


        const throws =
          Math.min(
            maxThrows,
            Math.max(
              minThrows,
              calculatedThrows
            )
          );


        return {

          id:
            player.id ||
            (
              'p_' +
              Date.now() +
              Math.random()
            ),

          name:
            player.name ||
            'Player',

          coinsSnapshot:
            coins,

          score: 0,

          initialThrows:
            throws,

          remainingThrows:
            throws

        };

      }
    );


  currentTurnIndex = 0;

  currentRound = 1;

  maxRounds = 1;

  hitMarkers = [];

  gameFinished = false;

  gameFinishTimestamp = 0;
  lastShownFinishTimestamp = 0;
  lastProcessedFinishTimestamp = 0;

  ranking = [];


  if (players.length > 0) {

    remainingThrows =
      players[0]
        .remainingThrows;

  } else {

    remainingThrows = 0;

  }


  lastProcessedHitTimestamp = 0;

  syncDartsSessionStart();


  broadcastStateToFirebase(
    true,
    'START'
  );


  renderInputState();

  renderOutputState();

}


/* =========================================================
   ゲームプレイヤー追加
========================================================= */

function addGamePlayer() {

  const name =
    prompt(
      '追加するプレイヤー名を入力してください'
    );


  if (!name) return;


  const throws =
    prompt(
      'このプレイヤーの投球数を入力してください',
      '3'
    );


  const throwNumber =
    Math.max(
      1,
      Number(throws) || 3
    );


  players.push({

    id:
      'game_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name.trim(),

    coinsSnapshot: 0,

    score: 0,

    initialThrows:
      throwNumber,

    remainingThrows:
      throwNumber

  });


  if (players.length === 1) {

    currentTurnIndex = 0;

    remainingThrows =
      throwNumber;

  }


  gameFinished = false;

  ranking = [];


  broadcastStateToFirebase();

  renderInputState();

  renderOutputState();

}


/* =========================================================
   プレイヤー削除
========================================================= */

function removeCurrentPlayer() {

  if (!players.length) return;


  const player =
    players[currentTurnIndex];


  if (!player) return;


  if (
    !confirm(
      player.name +
      'を削除しますか？'
    )
  ) {

    return;

  }


  players.splice(
    currentTurnIndex,
    1
  );


  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex = 0;

  }


  if (players.length) {

    remainingThrows =
      players[currentTurnIndex]
        .remainingThrows;

  } else {

    remainingThrows = 0;

  }


  gameFinished = false;

  ranking = [];


  broadcastStateToFirebase(
    true,
    'Player Change'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   点数リセット
========================================================= */

function resetGameScore() {

  if (
    !confirm(
      'ゲームの点数をすべてリセットしますか？'
    )
  ) {

    return;

  }


  players.forEach(
    player => {

      player.score = 0;

      player.remainingThrows =
        player.initialThrows;

    }
  );


  currentTurnIndex = 0;

  currentRound = 1;

  hitMarkers = [];

  gameFinished = false;

  ranking = [];


  remainingThrows =
    players.length
      ? players[0]
          .remainingThrows
      : 0;


  lastProcessedHitTimestamp = 0;


  broadcastStateToFirebase(
    true,
    'RESET'
  );

  renderInputState();

  renderOutputState();

}

const BOARD_CENTER = 500;

const BOARD_OUTER_RADIUS = 455;

const BOARD_DOUBLE_INNER = 420;

const BOARD_TRIPLE_OUTER = 300;

const BOARD_TRIPLE_INNER = 265;

const BOARD_BULL_OUTER = 70;

const BOARD_BULL_INNER = 31;


/* =========================================================
   極座標
========================================================= */

function polarPoint(
  cx,
  cy,
  radius,
  angle
) {

  const rad =
    (angle - 90) *
    Math.PI /
    180;


  return {

    x:
      cx +
      radius *
      Math.cos(rad),

    y:
      cy +
      radius *
      Math.sin(rad)

  };

}


/* =========================================================
   セクターパス
========================================================= */

function sectorPath(
  cx,
  cy,
  r1,
  r2,
  a1,
  a2
) {

  const p1 =
    polarPoint(
      cx,
      cy,
      r2,
      a1
    );


  const p2 =
    polarPoint(
      cx,
      cy,
      r2,
      a2
    );


  const p3 =
    polarPoint(
      cx,
      cy,
      r1,
      a2
    );


  const p4 =
    polarPoint(
      cx,
      cy,
      r1,
      a1
    );


  return [

    `M ${p1.x} ${p1.y}`,

    `A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}`,

    `L ${p3.x} ${p3.y}`,

    `A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}`,

    'Z'

  ].join(' ');

}


/* =========================================================
   SVG要素作成
========================================================= */

function createSvgElement(
  tag,
  attributes
) {

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      tag
    );


  Object.entries(attributes)
    .forEach(
      ([key, value]) => {

        el.setAttribute(
          key,
          value
        );

      }
    );


  return el;

}

  const graphics =
    document.getElementById(
      'board-graphics'
    );


  graphics.innerHTML = '';


  const cx = BOARD_CENTER;

  const cy = BOARD_CENTER;

  const outer =
    BOARD_OUTER_RADIUS;

  const doubleOuter =
    BOARD_DOUBLE_INNER;

  const tripleOuter =
    BOARD_TRIPLE_OUTER;

  const tripleInner =
    BOARD_TRIPLE_INNER;

  const bullOuter =
    BOARD_BULL_OUTER;

  const bullInner =
    BOARD_BULL_INNER;


  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          outer + 18,

        fill:
          '#121212',

        stroke:
          '#2b2b2b',

        'stroke-width':
          10

      }
    )
  );


  const sectorAngle =
    360 / 20;


  for (
    let i = 0;
    i < 20;
    i++
  ) {

      i * sectorAngle;

      sectorAngle / 2;


    const a2 =
      centerAngle +
      sectorAngle / 2;


    const doubleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const doublePath =

              cy,
              doubleOuter,
              outer,
              a1,
              a2

          fill:
            doubleColor,

          stroke:
            '#181818',

          'stroke-width':

    const outerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleOuter,
              doubleOuter,
              a1,
              a2
            ),

          fill:
            outerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

      );


    graphics.appendChild(
      outerSingle
    );


    const tripleColor =
      i % 2 === 0

        : '#218d42';


    const triple =
      createSvgElement(

            ),

    const innerSingleColor =

    const innerSingle =

        {

          d:
            sectorPath(

              bullOuter,
              tripleInner,
              a1,
              a2
            ),

          fill:
            innerSingleColor,

            '#181818',

          'stroke-width':
            2,

    graphics.appendChild(

    );

  graphics.appendChild(

        r:

        fill:
          '#218d42',

        stroke:
          '#171717',

        'stroke-width':

  graphics.appendChild(

        r:
          bullInner,

          '#cf2929',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    )
  );


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const angle =
      i * sectorAngle;


    const p =
      polarPoint(
        cx,
        cy,
        478,

      );


    const text =
      createSvgElement(
        'text',
        {

          x:

/* =========================================================
   ダーツボード座標取得
========================================================= */

function getBoardCoordinates(event) {

  const svg =
    document.getElementById(
      'dartboard'
    );


  const point =
    svg.createSVGPoint();


  point.x =
    event.clientX;

  point.y =
    event.clientY;


  const ctm =
    svg.getScreenCTM();


  if (ctm) {

    const local =
      point.matrixTransform(
        ctm.inverse()
      );


    return {

      x: local.x,

      y: local.y

    };

  }


  const rect =
    svg.getBoundingClientRect();


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      1000 /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      ) *
      1000 /
      rect.height

  };

}


/* =========================================================
   ダーツボード座標 → 得点
========================================================= */

function calculateDartScore(
  x,
  y
) {

  const dx =
    x - BOARD_CENTER;


  const dy =
    y - BOARD_CENTER;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (
    distance >
    BOARD_OUTER_RADIUS
  ) {

    return {

      score: 0,

      label: 'MISS',

      number: 0,

      multiplier: 0,

      soundType: 'miss'

    };

  }


  if (
    distance <=
    BOARD_BULL_INNER
  ) {

    return {

      score: 50,

      label: 'BULL',

      number: 25,

      multiplier: 2,

      soundType: 'doubleBull'

    };

  }


  if (
    distance <=
    BOARD_BULL_OUTER
  ) {

    return {

      score: 25,

      label: '25',

      number: 25,

      multiplier: 1,

      soundType: 'bull'

    };

  }


  let angle =
    Math.atan2(
      dx,
      -dy
    ) *
    180 /
    Math.PI;


  if (angle < 0) {

    angle += 360;

  }


  let index =
    Math.floor(
      (
        angle +
        BOARD_SECTOR_HALF
      ) /
      BOARD_SECTOR_ANGLE
    );


  index =
    (
      index +
      20
    ) % 20;


  const number =
    BOARD_NUMBERS[index];


  let multiplier = 1;

  let label = 'SINGLE';

  let soundType = 'normal';


  if (
    distance >=
    BOARD_DOUBLE_INNER
  ) {

    multiplier = 2;

    label = 'DOUBLE';

    soundType = 'double';

  }

  else if (
    distance >=
    BOARD_TRIPLE_INNER &&
    distance <
    BOARD_TRIPLE_OUTER
  ) {

    multiplier = 3;

    label = 'TRIPLE';

    soundType = 'triple';

  }


  return {

    score:
      number *
      multiplier,

    label:
      label,

    number:
      number,

    multiplier:
      multiplier,

    soundType:
      soundType

  };

}


const BOARD_SECTOR_ANGLE =
  360 / 20;

const BOARD_SECTOR_HALF =
  BOARD_SECTOR_ANGLE / 2;


/* =========================================================
   ダーツボードタッチ
========================================================= */

function handleBoardPointer(event) {

  event.preventDefault();


  if (gameFinished) {

    return;

  }


  if (
    !players.length ||
    currentTurnIndex < 0 ||
    currentTurnIndex >= players.length
  ) {

    return;

  }


  const player =
    players[currentTurnIndex];


  if (!player) return;


  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    return;

  }


  const point =
    getBoardCoordinates(
      event
    );


  const result =
    calculateDartScore(
      point.x,
      point.y
    );


  if (
    result.label === 'MISS'
  ) {

    return;

  }


  registerHit(
    result.score,
    result.label,
    result.soundType
  );

}


/* =========================================================
   得点登録
========================================================= */

function registerHit(
  score,
  label,
  soundType = 'normal'
) {

  if (!players.length) return;

  if (gameFinished) return;


  const player =
    players[currentTurnIndex];


  if (!player) return;


  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    return;

  }


  player.score =
    Number(
      player.score || 0
    ) +
    score;


  player.remainingThrows =
    Math.max(
      0,
      Number(
        player.remainingThrows || 0
      ) - 1
    );


  remainingThrows =
    player.remainingThrows;


  const marker = {

    score:
      score,

    label:
      label,

    soundType:
      soundType,

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  };


  hitMarkers.push(
    marker
  );


  lastProcessedHitTimestamp =
    marker.timestamp;


  showHitEffect(
    score,
    label
  );


  playScoreSound(
    soundType
  );


  if (
    player.remainingThrows <= 0
  ) {

    nextPlayer();

  } else {

    broadcastStateToFirebase();

    renderInputState();

    renderOutputState();

  }

}


/* =========================================================
   外れ
========================================================= */

function registerMiss() {

  if (!players.length) return;

  if (gameFinished) return;


  const player =
    players[currentTurnIndex];


  if (!player) return;


  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    return;

  }


  player.remainingThrows =
    Math.max(
      0,
      Number(
        player.remainingThrows || 0
      ) - 1
    );


  remainingThrows =
    player.remainingThrows;


  const marker = {

    score: 0,

    label: 'MISS',

    soundType: 'miss',

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  };


  hitMarkers.push(
    marker
  );


  lastProcessedHitTimestamp =
    marker.timestamp;


  showHitEffect(
    0,
    'MISS'
  );


  playScoreSound(
    'miss'
  );


  if (
    player.remainingThrows <= 0
  ) {

    nextPlayer();

  } else {

    broadcastStateToFirebase();

    renderInputState();

    renderOutputState();

  }

}


/* =========================================================
   次のプレイヤー
========================================================= */

function nextPlayer() {

  if (!players.length) return;


  currentTurnIndex++;


  /*
   * 全員終了。
   *
   * ここでは2週目へ進まず、
   * ゲーム終了としてランキングを作成する。
   */

  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex =
      players.length - 1;

    remainingThrows = 0;

    gameFinished = true;

    gameFinishTimestamp = Date.now();

    createRanking();

    if (currentDevice === 'output') {
      showFinishEffect();
    }

    lastProcessedFinishTimestamp =
      gameFinishTimestamp;

    playScoreSound('finish');

    syncDartsSessionFinish();


    broadcastStateToFirebase(
      true,
      'FINISH'
    );


    renderInputState();

    renderOutputState();

    return;

  }


  remainingThrows =
    players[currentTurnIndex]
      .remainingThrows;


  broadcastStateToFirebase(
    true,
    'PLAYER CHANGE'
  );


  renderInputState();

  renderOutputState();

}


/* =========================================================
   ランキング作成
========================================================= */

function createRanking() {

  ranking =
    players
      .map(
        (player, index) => ({

          ...player,

          originalIndex:
            index

        })
      )
      .sort(
        (a, b) => {

          const scoreDifference =
            Number(
              b.score || 0
            ) -
            Number(
              a.score || 0
            );

          if (
            scoreDifference !== 0
          ) {

            return scoreDifference;

          }

          return (
            a.originalIndex -
            b.originalIndex
          );

        }
      );

}

function getSoundMeta() {

  const meta = {};


  Object.keys(
    soundConfig
  ).forEach(
    type => {

      meta[type] = {

        enabled:
          !!soundConfig[type].enabled,

        fileName:
          soundConfig[type].fileName || ""

      };

    }
  );


  return meta;

}


/* =========================================================
   MP3ファイル選択
========================================================= */

function selectSoundFile(
  type,
  input
) {

  const file =
    input.files &&
    input.files[0];


  if (!file) return;


  const reader =
    new FileReader();


  reader.onload = function() {

    const dataUrl =
      reader.result;


    soundConfig[type] = {

      enabled: true,

      fileName:
        file.name,

      dataUrl:
        dataUrl

    };


    if (type === 'normal') {

      localSoundUrl =
        dataUrl;

      localAudio =
        new Audio(
          dataUrl
        );

      localAudio.preload =
        'auto';

    }


    localAudios[type] =
      new Audio(
        dataUrl
      );

    localAudios[type].preload =
      'auto';


    saveSoundConfigToFirebase();

    broadcastStateToFirebase();

  };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   サウンド設定クラウド保存
========================================================= */

function saveSoundConfigToFirebase() {

  if (!firebaseDb || !currentChannel) {

    try {

      localStorage.setItem(
        'darts_sounds_' +
        currentChannel,
        JSON.stringify(
          soundConfig
        )
      );

    } catch (e) {

      console.warn(
        'Local sound save failed:',
        e
      );

    }

    return;

  }


  firebaseDb
    .ref(
      'darts_sounds/' +
      getFirebaseSoundKey()
    )
    .set(
      soundConfig
    )
    .catch(
      error => {

        console.warn(
          'Firebase sound save failed:',
          error
        );

      }
    );

}


/* =========================================================
   Firebaseからサウンド設定受信
========================================================= */

function applyIncomingSoundConfig(
  data
) {

  if (!data) return;


  Object.keys(
    soundConfig
  ).forEach(
    type => {

      if (
        data[type] &&
        typeof data[type] === 'object'
      ) {

        soundConfig[type] = {

          enabled:
            !!data[type].enabled,

          fileName:
            data[type].fileName || "",

          dataUrl:
            data[type].dataUrl || ""

        };

      }

    }
  );


  Object.keys(
    soundConfig
  ).forEach(
    type => {

      const config =
        soundConfig[type];


      if (
        config.enabled &&
        config.dataUrl
      ) {

        createLocalAudio(
          type,
          config.dataUrl
        );

      }

    }
  );

}


/* =========================================================
   サウンド設定メタデータ反映
========================================================= */

function mergeSoundMeta(
  data
) {

  if (!data) return;


  Object.keys(
    soundConfig
  ).forEach(
    type => {

      if (
        data[type] &&
        typeof data[type] === 'object'
      ) {

        soundConfig[type].enabled =
          !!data[type].enabled;

        soundConfig[type].fileName =
          data[type].fileName || "";

      }

    }
  );

}


/* =========================================================
   ローカルAudio生成
========================================================= */

function createLocalAudio(
  type,
  dataUrl
) {

  if (!dataUrl) return;


  try {

    const audio =
      new Audio(
        dataUrl
      );


    audio.preload =
      'auto';


    localAudios[type] =
      audio;


    if (type === 'normal') {

      localAudio =
        audio;

      localSoundUrl =
        dataUrl;

    }

  } catch (e) {

    console.warn(
      'Audio creation failed:',
      e
    );

  }

}


/* =========================================================
   効果音再生
========================================================= */

function playScoreSound(
  soundType = 'normal'
) {

  const config =
    soundConfig[soundType];


  if (
    !config ||
    !config.enabled
  ) {

    return;

  }


  let audio =
    localAudios[soundType];


  if (
    !audio &&
    config.dataUrl
  ) {

    createLocalAudio(
      soundType,
      config.dataUrl
    );

    audio =
      localAudios[soundType];

  }


  if (!audio) return;


  try {

    audio.currentTime = 0;

    audio
      .play()
      .catch(
        () => {}
      );

  } catch (e) {

    console.warn(
      'Audio playback failed:',
      e
    );

  }

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(str) {

  return String(str)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   JavaScript用エスケープ
========================================================= */

function escapeJs(str) {

  return String(str)
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      '\\r'
    )
    .replace(
      /\n/g,
      '\\n'
    );

}

  try {

    const app =
      initializeApp(
        firebaseConfig
      );

    const database =
      getDatabase(app);


    /*
      提供されたコードと同じ形で
      他のscriptから使用できるようにする
    */

    window.firebaseDB =
      database;

    window.firebaseRef =
      ref;

    window.firebaseOnValue =
      onValue;

    window.firebaseSet =
      set;

    window.firebaseUpdate =
      update;


    /*
      メインのscriptから使用するための変数
    */

    window.firebaseReady =
      true;

    window.firebaseDatabase =
      database;


    /*
      既存コードの
      firebaseDb.ref(...).on(...)
      firebaseDb.ref(...).off()
      firebaseDb.ref(...).set()
      firebaseDb.ref(...).once()
      をそのまま動かすための互換ラッパー。
    */

    const listenerMap =
      new Map();


    function compatibleRef(
      path
    ) {

      const databaseRef =
        ref(
          database,
          path
        );


      return {

        on(
          event,
          callback
        ) {

          if (
            event !== 'value'
          ) {

            return;

          }


          const unsubscribe =
            onValue(
              databaseRef,
              callback
            );


          if (
            !listenerMap.has(path)
          ) {

            listenerMap.set(
              path,
              []
            );

          }


          listenerMap
            .get(path)
            .push(
              unsubscribe
            );


          return unsubscribe;

        },


        off() {

          const listeners =
            listenerMap.get(
              path
            ) || [];


          listeners.forEach(
            unsubscribe => {

              try {

                unsubscribe();

              } catch (e) {

                console.warn(
                  e
                );

              }

            }
          );


          listenerMap.delete(
            path
          );

        },


        set(
          value
        ) {

          return set(
            databaseRef,
            value
          );

        },


        once(
          event,
          callback
        ) {

          if (
            event !== 'value'
          ) {

            return;

          }


          return onValue(
            databaseRef,
            callback,
            {
              onlyOnce: true
            }
          );

        },


        update(
          value
        ) {

          return update(
            databaseRef,
            value
          );

        }

      };

    }


    /*
      既存メインコード用Firebase DB
    */

    window.firebaseDb = {

      ref:
        compatibleRef

    };


    firebaseReady =
      true;

    firebaseDb =
      window.firebaseDb;


    console.log(
      'Firebase Realtime Database: CONNECTED'
    );


    /*
      Firebase初期化完了後に、
      すでに画面が開かれていた場合も
      現在のチャンネルをクラウド接続する。
    */

    if (
      currentChannel
    ) {

      initFirebaseChannel(
        currentChannel
      );

      if (
        currentDevice === 'input'
      ) {
        watchDartsTableStatus();
      }

    }

  } catch(error) {

    console.error(
      "Firebase initialization error:",
      error
    );

    window.firebaseReady =
      false;

    firebaseReady =
      false;

  }

</script>
